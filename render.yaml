services:
  - type: web
    name: bounded
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 22.12.0
